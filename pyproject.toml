[project]
name = "sdp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb",
  "pyarrow",
  "boto3",
  "pydantic-settings",
  "exchange-calendars>=4.13.2",
  "httpx>=0.28.1",
  "polars>=1.43.2",
  # DuckDB needs pytz to convert a TIMESTAMP WITH TIME ZONE value into a
  # Python datetime. Without it, fetchall() on any relation that holds
  # window_start_utc raises. The polars path does not need it.
  "pytz",
]

[dependency-groups]
dev = ["ruff", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdp"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
