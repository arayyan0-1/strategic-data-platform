[project]
name = "sdp"
version = "0.1.0"
description = "A point-in-time US equity data lake and warehouse for quantitative research."
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmed Rayyan" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb",
  "boto3",
  "pydantic-settings",
  "exchange-calendars>=4.13.2",
  "httpx>=0.28.1",
  "numpy",
  # DuckDB needs pytz to return TIMESTAMPTZ values as Python datetimes.
  "pytz",
]

[dependency-groups]
dev = ["ruff", "pytest"]
transform = ["dbt-core", "dbt-duckdb"]
research = [
    "jupyterlab",
    "ipykernel",
    "scipy",
    "statsmodels",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
    "arch",
    "plotly",
    "polars>=1.43.2",
    "pyarrow",
]

[tool.uv]
default-groups = ["dev", "transform", "research"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
