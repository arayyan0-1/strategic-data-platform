[project]
name = "sdp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb",
  "pyarrow",
  "boto3",
  "pydantic-settings",
]

[dependency-groups]
dev = ["ruff", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdp"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]