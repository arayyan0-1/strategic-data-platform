[project]
name = "sdp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb",
  "pyarrow",
  "boto3",
  "pydantic-settings",
  "exchange-calendars>=4.13.2",
  "httpx>=0.28.1",
  "polars>=1.43.2",
  # DuckDB needs pytz to convert a TIMESTAMP WITH TIME ZONE value into a
  # Python datetime. Without it, fetchall() on any relation that holds
  # window_start_utc raises. The polars path does not need it.
  "pytz",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "ipykernel",
    "jupyterlab",
    "matplotlib",
    "scipy",
    "statsmodels",
    "altair",
    "plotly",
    "arch",
    "joblib>=1.6.0",
    "scikit-learn>=1.9.1",
]
# dbt is a separate group, because the ingest and the DAL do not import it.
# A check on 2026-08-22 shows that dbt-core 1.12.3, dbt-duckdb 1.11.0 and
# duckdb 1.5.5 resolve in one environment. A second venv is not necessary.
transform = ["dbt-core", "dbt-duckdb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdp"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
