name: sdp
version: "0.1.0"
config-version: 2
profile: sdp

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # The lake root. Absolute, because dbt starts from its own directory.
  data_root: "{{ env_var('SDP_DATA_ROOT') }}"

  # Sessions FINRA takes to publish a settlement date. A study must not read a
  # short interest number before this many sessions pass.
  short_interest_publication_sessions: 8

  # A session with fewer in_universe names than this is dropped from the IC.
  ic_min_names: 100

  # Universe filters. Each value is a modelling choice.
  universe_types: ["CS"]
  universe_exchanges: ["XNYS", "XNAS", "XASE"]
  min_price: 5.0
  min_dollar_volume: 1000000
  adv_window: 20
  min_days_in_window: 15
  min_days_since_first_bar: 60

models:
  sdp:
    staging:
      +materialized: table
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
