name: sdp
version: "0.1.0"
config-version: 2
profile: sdp

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  # dbt does not send usage events to dbt Labs.
  send_anonymous_usage_stats: false

vars:
  # How long FINRA takes to publish a settlement date, counted in XNYS sessions.
  # A study must not read a short interest number before this many sessions have
  # passed. It is a var and not a constant, because the schedule changed in the
  # past and a robustness check on it is cheap.
  short_interest_publication_sessions: 8

  # Universe. Each value is a modelling choice. Change one and run the study again.
  universe_types: ["CS"]
  universe_exchanges: ["XNYS", "XNAS", "XASE"]
  min_price: 5.0
  min_dollar_volume: 10000000
  adv_window: 20
  min_days_in_window: 15
  min_days_since_first_bar: 60

  # A vendor market cap of a month-end with no class share count is refused when each
  # nearest class count of the episode, before and after, disagrees with it by more
  # than this factor. A lower factor also refuses right values next to a share issue.
  company_cap_max_ratio: 2.0

  # A run of at most class_count_max_run month-ends of class counts is refused when it
  # jumps by more than class_count_max_ratio from the count before it, and the count
  # after it agrees with the count before within class_count_agree_ratio. The jump limit
  # is below 1.5, so that a lag after a 3-for-2 or a 2-for-1 split is a jump.
  class_count_max_ratio: 1.4
  class_count_agree_ratio: 1.25
  class_count_max_run: 6

  # The spread model (spreads): the half spread of the benchmark stock of Kyle and
  # Obizhaeva (2016), linear calibration, and the minimum price increment in dollars.
  spread_kappa0: 0.000821
  tick_size: 0.01

  # A new FIGI on a ticker continues the security only when the split-adjusted jump
  # from the last old bar to the first new bar is at most link_max_jump_sigma standard
  # deviations of the last link_vol_window daily returns of the old FIGI. The deviation
  # needs at least link_min_returns returns.
  link_vol_window: 63
  link_min_returns: 20
  link_max_jump_sigma: 4.0

  # The specific volatility of a name needs this many residuals before the session.
  # With two residuals, a new listing showed a move of 65 standard deviations.
  spec_vol_min_obs: 21

  # The forecast of the specific volatility. The weight of a residual halves every
  # spec_vol_half_life rows. The shrinkage pulls it toward the cap-weighted mean of the size
  # decile at the rate spec_vol_shrinkage (0 turns it off). The regime factor rescales every
  # forecast with the recent cross-section of z squared, and the weight of a session halves
  # every spec_vol_regime_half_life sessions. Both half-lives must be 2 or more. On the
  # development sessions the log-likelihood of the residuals rises as the regime half-life
  # falls to 1. A week stops one session from setting the scale of all forecasts.
  spec_vol_half_life: 126
  spec_vol_shrinkage: 0.1
  spec_vol_regime_half_life: 5

  # beta_252 needs this many returns in its window of 252. Below 126 the spread of beta
  # across names grows from 0.6 to between 1.6 and 30, and a new listing reached 1,401.
  beta_min_obs: 126

  # The style z-scores: the mean each is centered on (sqrt_cap, the regression weight, or
  # cap, as in Barra) and the largest absolute value. The center does not change the fit
  # or the residuals: the market and industry coefficients absorb it. With cap, the
  # market factor is the cap-weighted market and that market has no style exposure.
  style_center: cap
  style_clip: 3.0

  # The style fit clips the returns of each session at the weighted median plus or minus
  # this many robust standard deviations (1.4826 times the MAD). 0 means no clip. The
  # residual and r2 always use the raw returns, so a jump stays in the residual.
  style_return_clip: 0.0

  # A session with fewer in_universe names than this is dropped from the IC.
  ic_min_names: 100

  # signal_long_short.ret_winsorized clips a forward return at this quantile of its
  # session and at the quantile 1 - this value. It is a robustness check. A portfolio
  # does not earn it.
  long_short_winsor: 0.01

  # The evaluation calendar. Development is split into eval_folds contiguous folds, and a
  # signal is judged on development. The sessions from holdout_start are the holdout: a
  # signal meets it once, when it is final. The date stays fixed as the data grows.
  eval_folds: 4
  holdout_start: "2025-10-01"

  # The market monitor lists an item as an exception beyond these limits: a score of
  # monitor_z, a percentile in the outer monitor_pct of its history, and a stock-specific
  # score of monitor_z for a cap of monitor_big_cap. A score of 3 is as rare as a move of
  # 3 standard deviations of a normal distribution.
  monitor_z: 3.0
  monitor_pct: 0.05
  monitor_big_cap: 10000000000

  # The false discovery rate for the calendar effects (market_seasonality). An effect
  # is significant when it passes the Benjamini-Hochberg procedure at this rate among
  # the tests of its period.
  seasonality_fdr: 0.05

  # A score divides a move by the volatility known before the session. The volatility is
  # the root of an exponentially weighted mean of squared changes. Its half-life is
  # monitor_halflife sessions, it looks back monitor_vol_window sessions, and it needs
  # monitor_min_obs changes. Half-lives of 10 to 21 sessions had the same QLIKE loss within
  # 1%, and all beat a window of 63 sessions. The half-life of 15 had the most even tail
  # share from year to year among them.
  monitor_halflife: 15
  monitor_vol_window: 252
  monitor_min_obs: 63

  # The volatility of a rate or a spread is at least monitor_tick percentage points: the
  # quote step of FRED. Without the floor, a quiet spread that moves one step gets a
  # ratio of thousands. An ETF whose volatility is under monitor_min_etf_vol a year (a
  # T-bill fund) has no score. A factor return of less than monitor_zero_return is a
  # factor that is not defined yet, and its history starts at the first larger return.
  monitor_tick: 0.01
  monitor_min_etf_vol: 0.02
  monitor_zero_return: 1.0e-9

  # These groups of market_rates move in steps (a policy rate, a weekly index, the
  # balance sheet). A step is a huge move in units of the daily changes of the group, so
  # each group has its own pool and no exception.
  monitor_step_groups: ["Policy and money markets", "Fed balance sheet", "Conditions"]

seeds:
  sdp:
    +schema: reference

# Each layer and each mart domain is its own schema: staging.stg_massive__day_aggs,
# intermediate.int_universe, research.signal_ic.
models:
  sdp:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: core
      research:
        +schema: research
      factors:
        +schema: factors
      monitor:
        +schema: monitor
