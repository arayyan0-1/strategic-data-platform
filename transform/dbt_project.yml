name: sdp
version: "0.1.0"
config-version: 2
profile: sdp

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  # dbt does not send usage events to dbt Labs.
  send_anonymous_usage_stats: false

vars:
  # FINRA publication lag in XNYS sessions. A study must not read short interest earlier.
  short_interest_publication_sessions: 8

  # Universe filters (int_universe). Each is a modelling choice.
  universe_types: ["CS"]
  universe_exchanges: ["XNYS", "XNAS", "XASE"]
  min_price: 5.0
  min_dollar_volume: 10000000
  adv_window: 20
  min_days_in_window: 15
  min_days_since_first_bar: 60

  # A vendor cap with no class count is refused when each nearest class count disagrees by
  # more than this factor.
  company_cap_max_ratio: 2.0

  # A run of at most class_count_max_run month-end counts that jumps by more than
  # class_count_max_ratio is refused if the counts around it agree within class_count_agree_ratio.
  # Keep the jump limit below 1.5 so a lag after a 3-for-2 split counts as a jump.
  class_count_max_ratio: 1.4
  class_count_agree_ratio: 1.25
  class_count_max_run: 6

  # Spread model (spreads): Kyle-Obizhaeva half-spread calibration, and the tick in dollars.
  spread_kappa0: 0.000821
  tick_size: 0.01

  # A new FIGI continues the security only if the split-adjusted jump is within
  # link_max_jump_sigma standard deviations of the last link_vol_window returns of the old
  # FIGI, with at least link_min_returns returns.
  link_vol_window: 63
  link_min_returns: 20
  link_max_jump_sigma: 4.0

  # Residuals a name needs before it has a specific volatility.
  spec_vol_min_obs: 21

  # Specific volatility forecast: residual weight half-life in rows, shrinkage toward the size
  # decile mean (0 turns it off), and the regime factor's half-life in sessions. Both
  # half-lives must be 2 or more.
  spec_vol_half_life: 126
  spec_vol_shrinkage: 0.1
  spec_vol_regime_half_life: 5

  # Returns needed in the 252-session window before beta_252 is computed.
  beta_min_obs: 126

  # Style z-scores: the mean each is centered on (sqrt_cap, the regression weight, or cap, as in
  # Barra) and the largest absolute value. The center changes no fit or residual; with cap the
  # market factor is the cap-weighted market.
  style_center: cap
  style_clip: 3.0

  # Coverage models: common stock outside the estimation universe gets exposures and a residual
  # but never enters the fit. coverage_sessions limits the build to the latest N sessions (0 =
  # all); keep at least 2 years more than the window read, as a limit shortens the spec_vol history.
  coverage_types: ["CS", "ADRC"]
  coverage_sessions: 0

  # The style fit clips each session's returns at the weighted median plus or minus this many
  # robust deviations (1.4826 MAD); 0 = no clip. Residuals and r2 always use the raw returns.
  style_return_clip: 0.0

  # Minimum in_universe names for a session to count in the IC.
  ic_min_names: 100

  # signal_long_short.ret_winsorized clips returns at this quantile and 1 minus it. A
  # robustness check only.
  long_short_winsor: 0.01

  # Evaluation calendar: contiguous development folds, and the holdout from holdout_start,
  # which a final signal meets once. The date stays fixed as the data grows.
  eval_folds: 4
  holdout_start: "2025-10-01"

  # The signals whose holdout has been read. Every other signal has no label from the
  # holdout in signal_panel and the marts after it. read_holdout opens more for one build;
  # set it only through `python -m sdp.transform build --read-holdout`, which logs the read.
  holdout_read: ["reversal_1", "reversal_5", "momentum_12_1", "vol_20", "vol_60", "amihud_20",
                 "beta_252", "dividend_yield", "overnight_ret", "intraday_ret", "high_52w",
                 "short_ratio", "days_to_cover"]
  read_holdout: []

  # Monitor exception limits: a score of monitor_z, a percentile in the outer monitor_pct of
  # its history, and a stock-specific score for caps of monitor_big_cap or more.
  monitor_z: 3.0
  monitor_pct: 0.05
  monitor_big_cap: 10000000000

  # False discovery rate for market_seasonality (Benjamini-Hochberg within a period).
  seasonality_fdr: 0.05

  # Score volatility: exponentially weighted mean of squared changes with half-life
  # monitor_halflife sessions, looking back monitor_vol_window sessions, with at least
  # monitor_min_obs changes.
  monitor_halflife: 15
  monitor_vol_window: 252
  monitor_min_obs: 63

  # monitor_tick: least volatility of a rate or spread, in percentage points. An ETF under
  # monitor_min_etf_vol a year (a T-bill fund) has no score. A factor return under
  # monitor_zero_return means the factor is not defined yet.
  monitor_tick: 0.01
  monitor_min_etf_vol: 0.02
  monitor_zero_return: 1.0e-9

  # market_rates groups that move in steps. Each has its own score pool and no exception.
  monitor_step_groups: ["Policy and money markets", "Fed balance sheet", "Conditions"]

  # Fund exposures (fund_exposures). fund_types are the lines treated as funds. A fit needs
  # fund_min_adv of dollar volume, fund_min_returns earlier returns and fund_min_obs complete
  # rows in its window; it reads fund_window sessions, earns the next fund_step, and fund_ridge
  # is the penalty on standardized factor returns.
  fund_types: ["ETF", "ETN", "ETV", "ETS", "FUND"]
  fund_min_adv: 1000000
  fund_window: 252
  fund_step: 21
  fund_min_obs: 126
  fund_min_returns: 252
  fund_ridge: 5.0

  # FRED daily changes added to the fund regressions (see macro_factor_returns).
  fund_macro: ["d_t_10y", "d_t_2y", "d_dollar", "d_wti", "d_bitcoin", "d_eurusd"]

  # Fund specific volatility (fund_residuals): residual weight half-life in rows (2 or more)
  # and the residuals needed before the forecast exists.
  fund_spec_vol_half_life: 21
  fund_spec_vol_min_obs: 21

  # Paper fund (fund_candidates, fund_universe). The screener asset classes the fund may hold. A
  # candidate is eligible on a session with fund_universe_min_returns returns in the last
  # fund_min_returns rows and fund_universe_min_adv of trailing dollar volume.
  fund_asset_classes: ["Equity"]
  fund_universe_min_returns: 240
  fund_universe_min_adv: 5000000

  # Signals on the long index history (fund_signal_*): development is every formation month up to
  # this date. The signals are judged on development and shown on all months.
  fund_signal_dev_end: "2021-12-31"
  # Holdings forecast (fund_holdings_alpha): the shrink of every forecast, and the monthly
  # residual IC of short_ratio on development, which carries its sign through -short_ratio.
  fund_shrink: 0.5
  fund_hold_ic: 0.047

seeds:
  sdp:
    +schema: reference

# Each layer and each mart domain is its own schema: staging.stg_massive__day_aggs,
# intermediate.int_universe, research.signal_ic.
models:
  sdp:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: core
      research:
        +schema: research
      factors:
        +schema: factors
      monitor:
        +schema: monitor
      fund:
        +schema: fund
