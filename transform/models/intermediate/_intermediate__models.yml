version: 2

models:
  - name: int_ticker_episodes
    description: The ticker reference per date, with the key of each episode. A new episode starts when
      a FIGI changes, or when the first word of the name changes and the CIK is not the known one. A
      FIGI on one session between two sessions of the same other FIGI takes that FIGI.
    columns:
      - name: episode_key
        data_tests:
          - not_null

  - name: int_key_changes
    description: One row per change of FIGI key between two consecutive rows of a ticker, with each test
      of a link (identity, structure, price), the reviewed decision, whether it links, and whether it
      needs a review.
    columns:
      - name: linked
        data_tests:
          - not_null

  - name: int_security_links
    description: One row per new FIGI that continues the security of the old FIGI on the same ticker,
      from the rows of int_key_changes that link. basis is rule or reviewed.
    columns:
      - name: jump
        description: The log return of the split-adjusted close from the last old bar to the first new
          bar.
      - name: vol
        description: The standard deviation of the last daily log returns of the old key on the ticker.
      - name: old_key
        data_tests:
          - not_null
          - unique
      - name: new_key
        data_tests:
          - not_null
          - unique
      - name: root_key
        description: The first key of the chain of links. int_tickers_keyed gives it to the rows of the
          new key.
        data_tests:
          - not_null

  - name: int_tickers_keyed
    description: The ticker reference per date, with the security key and the rule that set it.
    columns:
      - name: security_key
        description: The episode key, or the first key of the chain when a link continues the security.
        data_tests:
          - not_null
      - name: episode_key
        description: The key of the episode. It is different from security_key after a link.
        data_tests:
          - not_null
      - name: key_rule
        description: share_class_figi_filled is a FIGI that the vendor dropped on this date, taken from
          the same ticker and CIK.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - share_class_figi
                  - share_class_figi_filled
                  - composite_figi
                  - cik_ticker
                  - ticker_only
      - name: type_filled
        description: The vendor type, or the last known type of the security where the vendor type is
          null.

  - name: int_security_lines
    description: One row per ticker and session with a bar, with the security key and the primary line
      of the security.
    columns:
      - name: is_primary_line
        description: One line per security and session. The shortest ticker wins, so a when-issued line
          gives way to the regular line.
        data_tests:
          - not_null

  - name: int_corporate_actions
    description: One row per ticker, event date and kind. Duplicate vendor rows are collapsed.
    columns:
      - name: ticker
        data_tests:
          - not_null
      - name: event_date
        data_tests:
          - not_null
      - name: kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - split
                  - dividend
      - name: cash_amount
        description: The largest per-share cash amount of the rows of a dividend key, special rows
          included. Null for a split.
      - name: regular_cash_amount
        description: The largest per-share cash amount of the rows of a dividend key that are not
          special. A row with no type counts as regular. Null for a split, and null when every row of
          the key is special. The dividend yield uses it. The price adjustment does not, because a
          special dividend also lowers the price.

  - name: int_prices_adjusted
    description: Unadjusted prices, the two factors and the adjusted columns, from two lookups of the next event. At
      a ticker change, the rows of the earlier ticker also take the factors of the later ticker of the
      same security.
    columns:
      - name: ticker
        data_tests:
          - not_null
      - name: date
        data_tests:
          - not_null
      - name: split_factor
        data_tests:
          - not_null
      - name: adj_close_split
        data_tests:
          - not_null
      - name: later_ticker
        description: The next ticker of the same security, whose factors this row takes. Null when the
          ticker does not change.

  - name: int_security_details
    description: One row per security and month-end, with the market cap of the share class and the industry.
    columns:
      - name: security_key
        data_tests:
          - not_null
      - name: cap_source
        description: The rule that set cap. A class_carried cap takes the last class count that is not
          refused, in place of a short run of wrong class counts or a refused vendor cap. A refused vendor
          cap with no such count is null.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - class_shares
                  - class_carried
                  - company_cap
                  - refused
      - name: industry
        data_tests:
          - not_null

  - name: int_universe
    description: The universe per date, from an instrument filter and a liquidity filter. The liquidity
      window and the seasoning count run over the primary line of each security.
    columns:
      - name: date
        data_tests:
          - not_null
      - name: ticker
        data_tests:
          - not_null
      - name: security_key
        data_tests:
          - not_null
      - name: is_primary_line
        description: The line that every series of the security reads on this session.
        data_tests:
          - not_null
      - name: adv
        description: The mean dollar volume of the security over the liquidity window, which ends at the
          session before. Null on the first session of the security and on a line that is not the
          primary line.
      - name: days_in_window
        description: The count of sessions with a dollar volume in that window. Null on a line that is
          not the primary line.
      - name: bars_seen
        description: The count of sessions of the security up to and including this one. A new security
          starts at 1, also on a ticker that another security used. Null on a line that is not the
          primary line.
      - name: market_cap
        description: The market cap of the share class, from the newest month-end of ticker details, moved
          with the split-adjusted price. Null when the month-end is over 70 days old.
      - name: industry
        description: The Fama-French 12-industry class of the SIC code. Unknown when the security has
          no code.
        data_tests:
          - not_null
      - name: passes_instrument
        data_tests:
          - not_null
      - name: passes_liquidity
        data_tests:
          - not_null
      - name: in_universe
        data_tests:
          - not_null

  - name: int_short_interest
    description: Short interest with the publication lag applied and the 999.99 cap removed.
    columns:
      - name: settlement_date
        description: The date the number describes.
        data_tests:
          - not_null
      - name: effective_date
        description: The first session the number was public. Null where the bars do not cover the settlement
          date.
      - name: ticker
        data_tests:
          - not_null
      - name: days_to_cover
        description: Null where the vendor returned the 999.99 cap. Use days_to_cover_computed.
      - name: days_to_cover_is_censored
        data_tests:
          - not_null

  - name: int_fund_returns
    description: The daily total return of the primary line of each fund (a security with a type in
      fund_types), on each session with a bar. Null when the line has no bar on the session before.
    columns:
      - name: security_key
        data_tests:
          - not_null
      - name: date
        data_tests:
          - not_null

  - name: int_borrow
    description: IBKR borrow per symbol and session with the security it maps to. matched_on says whether
      the composite FIGI or the ticker made the match; an unmatched symbol keeps a null security_key.
    columns:
      - name: symbol
        data_tests:
          - not_null

  - name: int_etf_daily
    description: One row per ETF and NAV date, from SSGA's history where it has the day, else the issuer
      screener. source says which, and where shares outstanding came from.
    columns:
      - name: nav
        data_tests:
          - not_null

  - name: int_etf_holdings
    description: Holdings per fund, as-of date and line, with the security_key of a US-listed line.
    columns:
      - name: fund
        data_tests:
          - not_null

  - name: int_index_returns
    description: The monthly total return in dollars of each index of the long history, on the last
      day of the month, with the US T-bill return of the month. The keys are region:<name> (market
      less the risk-free rate plus the risk-free rate of the regional file), country:<name> (the
      market portfolio of the country), us:market, us:small and us:big (the mean of three
      portfolios), us:value, us:growth, us:momentum, us:quality, us:low_vol, the same value, small
      and momentum segments outside the US (devx:) and in the emerging markets (em:), and
      cash:tbill. A month with an input missing has no row.

      The asset classes follow, from the value at the end of the month (the last observation of
      a daily FRED series; the value of the month for a monthly series, so the corporate yields
      and the World Bank prices, which are averages of the month, give smoothed returns).
      bond:ust_2y, bond:ust_5y, bond:ust_10y and bond:ust_30y are par bonds with semiannual
      coupons of the constant maturity yield, and bond:corp_aaa and bond:corp_baa par bonds of 20
      years at the Moody's yield. Each is bought at par at the yield of the month before and
      priced at the yield of the month with a month less to maturity, so its return is the price
      change plus the coupon accrued in the month (macro par_bond_return). bond:tips_10y is the
      same from the 10-year TIPS real yield plus the change of the CPI in the month. gold, silver
      and platinum are the change of the World Bank price. commodity:all, commodity:energy,
      commodity:metals, commodity:agriculture, commodity:base_metals and the single commodities
      (wti, natgas, copper, corn, wheat, soybeans, sugar) are the change of the World Bank price
      or index plus the T-bill return of the month as collateral; a spot price has no roll
      yield, so these returns lack the roll of a futures fund. crypto:bitcoin is the change of the Coinbase bitcoin price. A
      bond needs a yield in both months, so the 30-year series, which FRED does not state from
      February 2002 to February 2006, has no return for those months. The asset classes end at
      the last month of the T-bill return.
    columns:
      - name: index_key
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: ret
        data_tests:
          - not_null
      - name: rf
        description: The one-month US T-bill return of the month, from the research factors.
        data_tests:
          - not_null

  - name: int_fund_monthly_returns
    description: The monthly return of each candidate fund, spliced. A month takes the fund's own
      return where it has a full month (a close the month before, at least 15 sessions), else the
      return of the long-history index the fund maps to in fund_index_map. rf is the US T-bill
      return of the month, from the research factors, else the monthly compound of core.rates.rf.
      ret is null in a month where the fund's close is unknown and the index has no return.
  - name: int_fund_holdings_lines
    description: The long common-equity lines of each N-PORT report with the security_key of the line.
      The code (CUSIP, else ISIN) gives a FIGI at OpenFIGI, which is an episode key of int_tickers_keyed
      (matched_on figi). A line that misses, such as a security the vendor keys by CIK and ticker, matches
      on OpenFIGI's ticker and the first word of the name (matched_on ticker). Any other line keeps a
      null security_key. The one definition of the mapping.
    columns:
      - name: fund
        data_tests:
          - not_null
      - name: report_date
        data_tests:
          - not_null
      - name: filed
        data_tests:
          - not_null

  - name: int_fund_holdings_history
    description: The long common-equity holdings of each fund on each N-PORT report date, one row per
      security. weight is the value of the security's lines over the fund's long common-equity value
      on that date, so it sums to at most 1 and the unmapped lines are the rest. filed is when the
      public could first see the report, so a study uses the row only from that date.
    columns:
      - name: fund
        data_tests:
          - not_null
      - name: report_date
        data_tests:
          - not_null
      - name: filed
        data_tests:
          - not_null
      - name: security_key
        data_tests:
          - not_null
      - name: weight
        data_tests:
          - not_null

  - name: int_fund_holdings_coverage
    description: How much of each fund's long common-equity value on each report date maps to a
      security_key. n_lines counts the lines, n_mapped those with a key, weight_mapped their share of
      the value.
    columns:
      - name: fund
        data_tests:
          - not_null
      - name: month
      - name: report_date
        data_tests:
          - not_null
