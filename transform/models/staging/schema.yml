version: 2

models:
  - name: stg_corporate_actions
    description: One row per ticker, event date and kind. Duplicate vendor rows are collapsed.
    columns:
      - name: ticker
        tests: [not_null]
      - name: event_date
        tests: [not_null]
      - name: kind
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["split", "dividend"]

  - name: stg_tickers
    description: The ticker reference per date, with the security key and the rule that set it.
    columns:
      - name: security_key
        tests: [not_null]
      - name: key_rule
        description: share_class_figi_filled is a FIGI that the vendor dropped on this date, taken from the same ticker and CIK.
        tests:
          - accepted_values:
              arguments:
                values: ["share_class_figi", "share_class_figi_filled", "composite_figi", "cik_ticker", "ticker_only"]
      - name: type_filled
        description: The vendor type, or the last known type of the security where the vendor type is null.

  - name: stg_security_lines
    description: One row per ticker and session with a bar, with the security key and the primary line of the security.
    columns:
      - name: is_primary_line
        description: One line per security and session. The shortest ticker wins, so a when-issued line gives way to the regular line.
        tests: [not_null]

  - name: stg_prices_adjusted
    description: >
      Unadjusted prices, the two factors and the adjusted columns, from two as-of joins.
      At a ticker change, the rows of the earlier ticker also take the factors of the later
      ticker of the same security.
    columns:
      - name: ticker
        tests: [not_null]
      - name: date
        tests: [not_null]
      - name: split_factor
        tests: [not_null]
      - name: adj_close_split
        tests: [not_null]
      - name: later_ticker
        description: The next ticker of the same security, whose factors this row takes. Null when the ticker does not change.

  - name: stg_universe
    description: The universe per date, from an instrument filter and a liquidity filter.
    columns:
      - name: date
        tests: [not_null]
      - name: ticker
        tests: [not_null]
      - name: security_key
        tests: [not_null]
      - name: is_primary_line
        description: The line that every series of the security reads on this session.
        tests: [not_null]
      - name: passes_instrument
        tests: [not_null]
      - name: passes_liquidity
        tests: [not_null]
      - name: in_universe
        tests: [not_null]

  - name: stg_short_interest
    description: Short interest with the publication lag applied and the 999.99 cap removed.
    columns:
      - name: settlement_date
        description: The date the number describes.
        tests: [not_null]
      - name: effective_date
        description: The first session the number was public. Null where the bars do not cover the settlement date.
      - name: ticker
        tests: [not_null]
      - name: days_to_cover
        description: Null where the vendor returned the 999.99 cap. Use days_to_cover_computed.
      - name: days_to_cover_is_censored
        tests: [not_null]
