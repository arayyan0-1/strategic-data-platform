version: 2

models:
  - name: securities
    description: The security master. One row per security_key, with its tickers in order.
    columns:
      - name: security_key
        data_tests:
          - not_null
          - unique
      - name: ticker
        data_tests:
          - not_null

  - name: security_sessions
    description: One row per security and session from its primary line, with prices, adjusted prices
      and the universe state. The price series for notebooks.

  - name: rates
    description: Rates, credit spreads, volatility and financial conditions from FRED, one row
      per session. Each value is the latest observation dated before the session. rf is the
      return of cash on the session, from the 4-week bill rate and the calendar days since the
      session before.
    columns:
      - name: date
        data_tests:
          - not_null
          - unique
