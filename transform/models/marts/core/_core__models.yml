version: 2

models:
  - name: securities
    description: The security master. One row per security_key, with its tickers in order.
    columns:
      - name: security_key
        data_tests:
          - not_null
          - unique
      - name: ticker
        data_tests:
          - not_null

  - name: security_sessions
    description: One row per security and session from its primary line, with prices, adjusted prices
      and the universe state. The price series for research code.

  - name: rates
    description: Rates, credit spreads, volatility and financial conditions from FRED, one row
      per session. Each value is the latest observation dated before the session. rf is the
      return of cash on the session, from the 4-week bill rate and the calendar days since the
      session before.
    columns:
      - name: date
        data_tests:
          - not_null
          - unique

  - name: etfs
    description: The ETF master. One row per iShares or SSGA ETF from its newest screener row, whether its
      holdings are collected, and the span of its daily series.
    columns:
      - name: fund
        data_tests:
          - not_null
          - unique

  - name: etf_daily
    description: Daily NAV, shares outstanding, flow (change in shares times NAV) and premium (close over
      NAV, less one) per ETF and NAV date.
    columns:
      - name: nav
        data_tests:
          - not_null

  - name: etf_holdings
    description: Holdings per fund, as-of date and line, with the security_key of a US-listed line. A view.

  - name: borrow
    description: IBKR borrow per security and session. fee_rate and rebate_rate are annual percentages;
      available is capped at 10M shares (available_capped).
    columns:
      - name: security_key
        data_tests:
          - not_null
