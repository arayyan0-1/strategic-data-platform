version: 2

models:
  - name: style_exposures
    description: The industry and the eight style z-scores of each in-universe name per session, with
      its regression weight and the return of the next session.
    config:
      style_center: "{{ var('style_center') }}"
      style_clip: "{{ var('style_clip') }}"
    columns:
      - name: security_key
        data_tests:
          - not_null
      - name: industry
        data_tests:
          - not_null

  - name: style_factor_returns
    description: Pure style factor returns from one weighted cross-sectional regression per session. With
      style_return_clip above 0, the fit clips the returns of the session around their weighted median.
    config:
      style_return_clip: "{{ var('style_return_clip') }}"
    columns:
      - name: date
        data_tests:
          - not_null
          - unique
      - name: market
        description: The intercept, the return of the regression-weighted market.
      - name: r2
        description: The weighted share of the variance of the raw returns that the model explains on the session.

  - name: style_residuals
    description: The return of each in-universe name split into market, industry and style parts and a
      stock-specific residual, with the residual in units of its forecast volatility. The forecast
      reads only the sessions before the row.
    columns:
      - name: security_key
        data_tests:
          - not_null
      - name: resid
        data_tests:
          - not_null
      - name: own_vol
        description: The root mean square of the residuals of the name before the session, weighted so
          that the weight halves every spec_vol_half_life rows. Null with fewer than spec_vol_min_obs
          residuals.
      - name: vol_regime
        description: The factor for the volatility regime, the same for all names on a session. It is the
          square root of the weighted mean, over the sessions before, of the cross-section mean of the
          squared residual in units of the forecast without the factor. It is 1 when no session before
          has a forecast.
        data_tests:
          - not_null
      - name: spec_vol
        description: The forecast of the volatility of the residual for the session. It is own_vol pulled
          toward the cap-weighted mean of its size decile, times vol_regime.
      - name: resid_z
        description: The residual in units of spec_vol.

  - name: coverage_exposures
    description: The industry and the eight style z-scores of each common stock that the universe leaves
      out (the types in coverage_types), per session, with the return of the next session. The z-scores use
      the parameters of the universe of the session (winsor bounds, mean and standard deviation), so they
      share its scale, and a missing characteristic gives 0. The build covers the latest coverage_sessions
      sessions, or all with 0.
    config:
      style_center: "{{ var('style_center') }}"
      style_clip: "{{ var('style_clip') }}"
      coverage_sessions: "{{ var('coverage_sessions') }}"
      coverage_types: "{{ tojson(var('coverage_types')) }}"
    columns:
      - name: security_key
        data_tests:
          - not_null
      - name: industry
        data_tests:
          - not_null
      - name: fwd_ret_1
        description: The return of the next session. Null when the name has no bar on the next session,
          because the return of a longer gap does not belong to the factor returns of one session.

  - name: coverage_residuals
    description: The return of each coverage name split into market, industry and style parts and a
      stock-specific residual, with the residual in units of its forecast volatility. The parts are the
      exposures of coverage_exposures times the factor returns of style_factor_returns. The forecast is the
      own volatility from the residuals of the name before the session, from the universe and from the
      coverage set, times the vol_regime of the universe. It has no size-decile shrinkage.
    columns:
      - name: security_key
        data_tests:
          - not_null
      - name: resid
        data_tests:
          - not_null
      - name: market_cap
        description: The market cap of the share class on the session of the exposure, the close before the
          return. Null when the vendor gives none.
      - name: own_vol
        description: The root mean square of the earlier residuals of the name, weighted so that the weight
          halves every spec_vol_half_life rows. Null with fewer than spec_vol_min_obs residuals.
      - name: vol_regime
        description: The factor for the volatility regime, the same as in style_residuals on the session.
        data_tests:
          - not_null
      - name: spec_vol
        description: The forecast of the volatility of the residual for the session. It is own_vol times
          vol_regime.
      - name: resid_z
        description: The residual in units of spec_vol.

  - name: pca_factor_returns
    description: The top five eigenportfolios of the trailing correlation matrix, held out of sample.
    columns:
      - name: date
        data_tests:
          - not_null
          - unique
      - name: pc1_share
        description: The absorption ratio. A high value means that the stocks move together.

  - name: ff_mimic_returns
    description: The Fama-French factors mimicked with the style and statistical portfolios, out of sample,
      up to the last session.
    columns:
      - name: date
        data_tests:
          - not_null
          - unique

  - name: factor_returns
    description: Every factor return in one long table, by family (quintile, style, industry, pca, ff,
      ff_industry, ff_mimic, q).
    columns:
      - name: date
        data_tests:
          - not_null
      - name: family
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - quintile
                  - style
                  - industry
                  - pca
                  - ff
                  - ff_industry
                  - ff_mimic
                  - q
      - name: factor
        data_tests:
          - not_null

  - name: factor_performance
    description: Compounded returns over standard windows, volatility, Sharpe ratio and drawdown, per
      factor.
    columns:
      - name: factor
        data_tests:
          - not_null

  - name: factor_correlation
    description: The correlation of the daily returns of each pair of factors over the last two years.

  - name: factor_scores
    description: The score of the move of each factor over 1 and 21 sessions, one row per factor, horizon
      and session. A score of 3 is as rare as a 3 sigma move of a normal distribution on the history of the
      factors of its family.
    columns:
      - name: z_raw
        description: The log return over the volatility known before the last session of the move, times the
          root of the horizon.
      - name: z
        description: The score, the normal quantile of the share of the pool of the family that has a
          z_raw at least as large.

  - name: factor_risk
    description: The risk state of each factor on its last session in units of its own history (score,
      volatility percentile, drawdown percentile, correlation shift, crowding).
    columns:
      - name: factor
        data_tests:
          - not_null

  - name: factor_crowding
    description: Crowding of each style from short interest in its short leg less its long leg, per settlement.

  - name: macro_factor_returns
    description: The change of each macro series over each session (yields and spreads in percentage
      points, currencies, the dollar, oil and bitcoin in log points). A session after the last observation
      of a series is pending, so its change is null and not 0.
    columns:
      - name: date
        data_tests:
          - not_null
          - unique
      - name: d_curve_10y_2y
        description: The change of the 10-year yield less the change of the 2-year yield.
      - name: pending
        description: The factors whose series has no observation yet on the session. It is an empty list
          when none is pending. A null change that is not in the list has no observation before the start
          of its series.
        data_tests:
          - not_null

  - name: fund_exposures
    description: The loadings of each liquid fund on the style, industry and macro factors, from a ridge
      regression of its daily return on the factor returns over the window before each fit. One row is one
      fit. The loadings earn the sessions from fit_date to last_date.
    config:
      fund_macro: "{{ var('fund_macro') | join(',') }}"
      fund_window: "{{ var('fund_window') }}"
      fund_step: "{{ var('fund_step') }}"
      fund_min_obs: "{{ var('fund_min_obs') }}"
      fund_min_returns: "{{ var('fund_min_returns') }}"
      fund_min_adv: "{{ var('fund_min_adv') }}"
      fund_ridge: "{{ var('fund_ridge') }}"
    columns:
      - name: security_key
        data_tests:
          - not_null
      - name: fit_date
        description: The first session that the loadings earn.
        data_tests:
          - not_null
      - name: window_end
        description: The last session that the fit reads, the session before fit_date.
        data_tests:
          - not_null
      - name: last_date
        description: The last session that the loadings earn.
      - name: r2_in
        description: The share of the variance of the returns of the window that the fit explains.
      - name: n_obs
        description: The count of rows of the window with the return of the fund and every factor.
      - name: ridge
        description: The penalty of the fit.
      - name: intercept
        description: The daily constant of the fit. It is not a factor part.
      - name: market
        description: The loading on the market, in the units of the market exposure of a stock (1 for a stock).
      - name: d_t_10y
        description: The loading on the change of the 10-year yield in percentage points. The duration in
          years is minus 100 times the loading.

  - name: fund_residuals
    description: The return of each fund split into market, industry, style and macro parts from its
      exposures, and a residual with its forecast volatility. One row per fund and session that a fit
      covers. The forecast reads only the sessions before the row.
    columns:
      - name: security_key
        data_tests:
          - not_null
      - name: date
        data_tests:
          - not_null
      - name: fit_date
        description: The fit of fund_exposures that gave the loadings of the row.
        data_tests:
          - not_null
      - name: alpha
        description: The intercept of the fit, the daily constant of the fund. It is not a factor part.
      - name: macro_part
        description: The macro factors times their loadings. A factor with no observation yet adds 0.
      - name: macro_pending
        description: True when a macro factor of fund_macro has no observation yet on the session. The
          residual of the row then still holds the move of that factor.
        data_tests:
          - not_null
      - name: resid
        description: The return less alpha and the market, industry, style and macro parts.
        data_tests:
          - not_null
      - name: spec_vol
        description: The root mean square of the residuals of the fund before the row, weighted so that the
          weight halves every fund_spec_vol_half_life rows. A row with macro_pending has no weight. Null with
          fewer than fund_spec_vol_min_obs residuals.
      - name: resid_z
        description: The residual in units of spec_vol.
