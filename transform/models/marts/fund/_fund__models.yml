version: 2

models:
  - name: fund_candidates
    description: Every ETF of the two screeners and of the seed fund_extra_etfs, with the rule that keeps
      it out of the paper fund (excluded_by), or is_candidate when it passes. role is cash for a T-bill
      fund (found by name) and equity for every other fund; only an equity fund must be of an allowed
      asset class. A fund holding one country is allowed. source says where the row comes from
      (screener or seed; a fund in both keeps its screener row). expense_ratio is a fraction a year.
    columns:
      - name: fund
        data_tests:
          - not_null
          - unique
      - name: role
        description: cash for a T-bill fund, else equity.

  - name: fund_universe
    description: One row per candidate fund and session, with its role (equity or cash) and what is known
      at the close (returns, trailing dollar volume, volatility, the modelled half spread, the expense
      ratio) and whether the fund is eligible that day.

  - name: fund_signal_history
    description: The signals of the long index history at the end of each month, with the return that
      follows, one row per index and month. mom is the return of months t-11 to t-1, val is minus
      the return of months t-59 to t-12 (the five-year reversal, a value proxy), and trend is the
      return of months t-11 to t less the T-bill return of the same months. A signal is null unless
      every month of its window has a return, so val is null for the first four years of an index.
      fwd_ret and fwd_excess are the return and the excess return of month t+1. The universe is
      regions, countries or us_segments; us_market holds us:market for the timing study.
    columns:
      - name: index_key
        data_tests:
          - not_null
      - name: universe
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - regions
                  - countries
                  - us_segments
                  - us_market
      - name: month
        data_tests:
          - not_null
      - name: mom
        data_tests:
          - not_null
      - name: trend
        data_tests:
          - not_null

  - name: fund_signal_ic
    description: The cross-sectional information coefficient of mom, val and their combination
      against the return of the next month, for each universe and period. combo is the mean of the
      z-scores of mom and val over the names that have both. A month counts for a signal when at
      least five names have it and a next-month return, so mom, which needs 12 months of history,
      has a longer sample than val and combo, which need 60. mean_ic is the mean of the monthly
      Spearman correlations and t_nw its Newey-West t with a lag of 5. spread_ann
      is the mean monthly return of the top third of names by signal less the bottom third, equal
      weight, times 12, and spread_t_nw its Newey-West t. development is every formation month up
      to fund_signal_dev_end; all is every month.
    config:
      fund_signal_dev_end: "{{ var('fund_signal_dev_end') }}"
    columns:
      - name: universe
        data_tests:
          - not_null
      - name: signal
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - mom
                  - val
                  - combo
      - name: period
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - development
                  - all

  - name: fund_trend_summary
    description: A timing rule against buy and hold on each region and on the US market. At the end of
      month t the timed book holds the index in month t+1 when trend is above 0, and the T-bill
      otherwise. Returns are annualized geometrically, ann_vol is the monthly standard deviation times
      the root of 12, sharpe is on the return over the T-bill return, and max_drawdown is the largest
      fall from a peak of wealth (negative). The bh_ columns are the same measures for buy and hold.
      share_invested is the share of months the timed book holds the index. development is every
      formation month up to fund_signal_dev_end; all is every month.
    columns:
      - name: index_key
        data_tests:
          - not_null
      - name: period
        data_tests:
          - not_null

  - name: fund_signals
    description: The signals of each candidate fund at the end of each month, from its spliced monthly
      series (its own return where it has a full month, else the return of the index it maps to in
      fund_index_map). mom, val and trend are defined as in fund_signal_history, and a window counts
      only when its months are consecutive.

  - name: fund_index_features
    description: The panel of the machine-learning study of index returns, one row per index and
      month of the regions, countries and US segments (not us:market). The features are known at the
      end of month t. r3 and r6 are the returns of the last 3 and 6 months, mom, val and trend are
      those of fund_signal_history, vol12 is the standard deviation of the last 12 monthly returns,
      and dd12 is the largest fall from a peak of the wealth path of those 12 months (0 or below;
      the wealth starts at 1 before the first month). val is null for the first 48 rows of an
      index; the others are never null. target is the return of month t+1 less the mean return of
      that month over the names of the universe, null for the last month of an index.
    columns:
      - name: index_key
        data_tests:
          - not_null
      - name: universe
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - regions
                  - countries
                  - us_segments
      - name: month
        data_tests:
          - not_null

  - name: fund_features
    description: The features of fund_index_features for each candidate fund and month, from the
      spliced monthly series of int_fund_monthly_returns, and so for the months before the fund
      listed too (its index's). mom, val and trend are those of fund_signals. The universe is the one
      of the index the fund maps to in fund_index_map, and a fund of us:market is in us_segments;
      a fund with no equity index (a cash fund) has no row. A row needs mom and trend. There is no
      target. val is null for a fund whose series is shorter than 60 months.
    columns:
      - name: fund
        data_tests:
          - not_null
      - name: universe
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - regions
                  - countries
                  - us_segments
      - name: month
        data_tests:
          - not_null

  - name: fund_ml_ic
    description: Walk-forward forecasts of the relative return of an index, judged on development.
      A ridge model (penalty from 0.1 to 1000, chosen on the last fifth of each training set) and
      a gradient-boosted tree model (fixed settings), each pooled over the three universes with
      the features of fund_index_features, their cross-sectional ranks and a universe indicator.
      The models are refitted at the start of each year from 1996 on every row whose target month
      is before January of that year, and predict the months of the year. The baselines combo
      (the mean of the z-scores of mom and val) and mom are scored on the same months and names,
      the rows with a target, mom and val in the scored months, so a model is judged only where
      the baselines exist. mean_ic is the mean of the monthly Spearman correlations of the
      prediction with the target, t_nw its Newey-West t with a lag of 5, n_months the months with
      at least five names, spread_ann the mean top third less the bottom third of the target by
      prediction times 12 and spread_t_nw its t. beats_baselines is true for a model whose mean_ic
      is above that of combo and of mom in the universe. clears_gate adds t_nw of 2 or more. The
      scored months end at fund_signal_dev_end.
    config:
      fund_signal_dev_end: "{{ var('fund_signal_dev_end') }}"
    columns:
      - name: universe
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - regions
                  - countries
                  - us_segments
      - name: model
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ridge
                  - gbt
                  - combo
                  - mom

  - name: fund_ml_scores
    description: The score of each model for each fund and month after development, from models
      fitted once on every development row (target month up to fund_signal_dev_end) of
      fund_index_features and applied to fund_features, with no refit on later data. The score is a
      forecast of the return of the next month relative to the other names of the universe. A
      fund's rank features are taken among the funds of its universe in the month.
    config:
      fund_signal_dev_end: "{{ var('fund_signal_dev_end') }}"
    columns:
      - name: fund
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: model
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ridge
                  - gbt
      - name: score
        data_tests:
          - not_null

  - name: fund_holdings_alpha
    description: The forecast of each US-equity ETF a year from the stocks it holds, at the last session of
      each month. It is the holdings-weighted Grinold forecast of short_ratio, from the latest N-PORT
      filed before that session whose holdings are at most 200 days old. alpha_mkt is the cap-weighted
      forecast of the in-universe US stocks and alpha_neutral = alpha_hold - alpha_mkt, the
      benchmark-neutral forecast the fund uses. weight_scored is the share of the mapped holdings that
      has a forecast.

  - name: fund_asset_history
    description: The 12-month trend of ten assets at the end of each month, with the excess return
      that follows, one row per asset and month. The assets are region:developed, the Treasury bonds
      bond:ust_2y, bond:ust_5y, bond:ust_10y and bond:ust_30y, bond:tips_10y, bond:corp_baa, gold,
      commodity:all and crypto:bitcoin. trend is the return of months t-11 to t less the T-bill
      return of the same months, as in fund_signal_history, and a month has one only when all 12
      months have a return. state is +1 when trend is above 0 and -1 otherwise, so a trend of
      exactly 0 is down. fwd_excess is the return less the T-bill return of month t+1, null for the
      last month of an asset.
    columns:
      - name: index_key
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: trend
        data_tests:
          - not_null
      - name: fwd_excess
        description: The excess return of the next month. Null for the last month of an asset, and
          for a month before a gap in the returns.
      - name: state
        description: The sign of trend, +1 or -1. Never 0.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 1
                  - -1
                quote: false

  - name: fund_asset_gate
    description: The gate for trend following on each asset, one row per asset and period. Each
      formation month with a trend and a next month is in the up state (trend above 0) or the down
      state. mu_up and mu_down are the mean excess return of the next month in each state times 12,
      mu_all the mean of both times 12, and diff = mu_up - mu_down. t_nw is the Newey-West t, with a
      lag of 5, of b in the regression fwd_excess = a + b * 1{state = +1}, which is diff. passes is
      the decision of the gate, t_nw of at least 2 on development; the all row repeats it, so the
      decision is not reread from the full sample. development is every formation month up to
      fund_signal_dev_end; all is every month. The months of an asset are those with a trend and a
      next month, so a gap in the returns removes the months around it and the lag of the t runs
      across it.
    config:
      fund_signal_dev_end: "{{ var('fund_signal_dev_end') }}"
    columns:
      - name: index_key
        data_tests:
          - not_null
      - name: period
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - development
                  - all
      - name: n_up
        description: Formation months in the up state.
      - name: n_down
        description: Formation months in the down state.
      - name: mu_up
        description: Mean excess return of the next month after an up trend, times 12.
      - name: mu_down
        description: Mean excess return of the next month after a down trend, times 12.
      - name: mu_all
        description: Mean excess return of the next month over both states, times 12.
      - name: diff
        description: mu_up - mu_down.
      - name: t_nw
        description: Newey-West t (lag 5) of diff. Null when a period has fewer than 3 months or
          one state only.
      - name: passes
        description: True when t_nw is at least 2 on development. The same on both rows of an asset.
        data_tests:
          - not_null
