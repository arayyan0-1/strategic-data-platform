version: 2

seeds:
  - name: ff12_industries
    description: The SIC ranges of the Fama-French 12 industries.

  - name: monitor_etfs
    description: The ETFs of the cross-asset board of the monitor, with their group, label and position.

  - name: factor_labels
    description: A readable label for each factor of each family, and for each signal (the quintile family).

  - name: security_link_decisions
    description: The reviewed decisions on a change of FIGI key that the identity tests of a link cannot
      settle, one row per ticker and link date. link continues the security, refuse starts a new one.
      The structure and price tests of int_key_changes still apply to a link.
    config:
      column_types:
        ticker: varchar
        link_date: date
        decision: varchar
        reason: varchar
    columns:
      - name: decision
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['link', 'refuse']

  - name: etf_holdings_funds
    description: The ETFs whose holdings files are collected, added by python -m sdp.ingest.etf_holdings
      --select. A fund joins when its holdings overlap every listed fund by less than 0.9 (the sum of the
      smaller weight per holding); funds are never removed.
    config:
      column_types:
        fund: varchar
        issuer: varchar
        name: varchar
        asset_class: varchar
        holdings_url: varchar
        total_net_assets_bn: double
        max_overlap: double
        overlaps_with: varchar
        added_on: date

  - name: fund_extra_etfs
    description: ETFs that no screener lists and the paper fund may hold (the Vanguard funds), one row per
      fund, each fee read on the fund's own page on checked_on. expense_ratio is a percent a year, as in
      core.etfs. A fund the screeners also list keeps its screener row in fund_candidates. A fund whose
      fee was not read does not belong here.
    config:
      column_types:
        fund: varchar
        issuer: varchar
        name: varchar
        asset_class: varchar
        sub_asset_class: varchar
        region: varchar
        country: varchar
        expense_ratio: double
        checked_on: date
        source_url: varchar
    columns:
      - name: fund
        data_tests:
          - not_null
      - name: expense_ratio
        data_tests:
          - not_null

  - name: fund_index_map
    description: The long-history index that stands in for each paper-fund candidate when a return signal
      is computed, one row per candidate (equity and cash). index_key is a region (region:developed,
      region:developed_ex_us, region:north_america, region:europe, region:japan,
      region:asia_pacific_ex_japan, region:emerging), a developed country of the Fama-French international
      countries file (country:<name> in lower case with underscores), a US series (us:market, us:small,
      us:big, us:value, us:growth, us:momentum, us:quality, us:low_vol) or cash:tbill. It is empty when no
      key fits. basis says why, and what the proxy leaves out. The map reads each fund's stated mandate,
      never its returns. A candidate without a row is listed by a warning test.
    config:
      column_types:
        fund: varchar
        index_key: varchar
        basis: varchar
    columns:
      - name: fund
        data_tests:
          - not_null

  - name: nport_funds
    description: The US-equity ETFs whose Form N-PORT holdings are collected. The fund is the ticker,
      cik the registrant's CIK and series_id the EDGAR series, both from SEC's fund ticker file. A fund
      that file does not list is not here (SPY, MDY and DIA).
    config:
      column_types:
        fund: varchar
        cik: varchar
        series_id: varchar
    columns:
      - name: fund
        data_tests:
          - not_null
          - unique
      - name: series_id
        data_tests:
          - not_null
